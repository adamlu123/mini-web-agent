[tool.uv]
conflicts = [
    [
        { extra = "full" },
        { extra = "weavebench" },
    ],
    [
        { extra = "osworld" },
        { extra = "weavebench" },
    ],
    [
        { extra = "odysseys" },
        { extra = "weavebench" },
    ],
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "cuawright*",
]
exclude = [
    "assets*",
    "benchmark_releases*",
    "cache*",
    "docs*",
    "evaluation_examples*",
    "logs*",
    "monitor*",
    "scripts*",
]

[tool.setuptools.package-data]
"cuawright.environments.benchcad" = ["container/*"]
"cuawright.environments.cadgenbench" = ["container/*"]
"cuawright" = ["releases/*.json", "releases/*.md"]

[dependency-groups]
dev = [
    "black",
    "pytest>=9.1.1",
]
