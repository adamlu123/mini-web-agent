[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuawright"
version = "0.1.0"
description = "A terminal-first multi-benchmark harness for persistent computer-use agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "computer-use",
    "desktop-automation",
    "benchmark",
    "agents",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/TheoLeeCJ/cuawright-cua"
Repository = "https://github.com/TheoLeeCJ/cuawright-cua"
Documentation = "https://github.com/TheoLeeCJ/cuawright-cua#readme"
Issues = "https://github.com/TheoLeeCJ/cuawright-cua/issues"
OSWorld = "https://github.com/xlang-ai/OSWorld-V2"
OSWorld-Data = "https://huggingface.co/datasets/xlangai/osworld_v2_tasks"

[project.scripts]
cuawright = "cuawright.cli:main"

[project.optional-dependencies]
providers = [
    "anthropic[aiohttp]>=1.0.0",
    "openai",
    "Pillow~=11.0.0",
    "requests~=2.31.0",
]
