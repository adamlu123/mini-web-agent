model:
  model_class: openai_compatible
  model_name: policy
  endpoint: http://127.0.0.1:8000/v1/chat/completions
  api_key: dummy
  request_timeout_seconds: 240
  max_output_tokens: 12000
  response_mode: sft_bash
  attach_observation_screenshot: false
  observation_template: |
    Observation:
    Status: {{ 'ok' if observation.success else 'error' }}
    Workspace: /workspace
    Working directory: /workspace
    Command: {{ observation.command }}
    Return code: {{ observation.returncode }}
    {% if observation.exception %}Exception:
    {{ observation.exception }}
    {% endif %}{% if observation.command_output %}Command output:
    {{ observation.command_output }}
    {% endif %}{% if observation.final_script_path %}final_script.py: /workspace/final_script.py
    {% endif %}{% if observation.workspace_files %}Recent workspace files:
    {{ observation.workspace_files | join('\n') }}
    {% endif %}{% if observation.recent_screenshots %}Recent screenshots:
    {{ observation.recent_screenshots | join('\n') }}
    {% endif %}
  format_error_template: |
    Format error:

    {{ error }}

    Respond in exactly one of these SFT formats and nothing else:
    <think>
    reasoning
    </think>
    <bash>
    exactly one shell command
    </bash>

    or, only after verified completion:
    <think>
    final verification reasoning
    </think>
    <answer>
    final response
    </answer>

agent:
  agent_class: default
  prompt_mode: sft
  step_limit: 30
  debug_log: true
  output_path:
  require_self_reflection_success: true
  judge_mode: tool
  summary_every_n_steps: 10
  summary_user_prompt: |
    You are compacting the working context for the same web task.

    Respond in EXACTLY this SFT format and nothing else:
    <think>
    compacting history
    </think>
    <answer>
    A concise but complete continuation summary. Include the original task, workspace artifacts already created, current plan.md critical points and status, important URLs/selectors/findings, final_runs state, latest errors, and the next action. Keep it under 900 words.
    </answer>

environment:
  environment_class: local_workspace
  start_url:
  output_dir: outputs/sft_vllm
  command_timeout_seconds: 240
  shell: /bin/bash
  credentials_file: /home/luyadong/cred.sh
  task_metadata_filename: task.json
  final_script_name: final_script.py
  output_truncation_chars: 24000
  final_script_preview_chars: 4000
  recent_files_limit: 40
  workspace_alias: /workspace
  prepend_tools_to_pythonpath: true
  prefer_current_python: true
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    MWA_BROWSER_BACKEND: browserbase
    MWA_BROWSER_WIDTH: '1280'
    MWA_BROWSER_HEIGHT: '1800'
    OPENAI_GATEWAY_ENDPOINT: http://gateway.phyagi.net/api/responses
    OPENAI_GATEWAY_MODEL: gpt-5.4

run:
  tasks_file: src/miniswewebagent/run/benchmarks/om2w_260220.json
  task_level: hard
  parallel_processes: 1
  judge_enabled: true
  judge_model: o4-mini
  judge_endpoint: ""
  judge_python:
  judge_script:
  logs_root: logs