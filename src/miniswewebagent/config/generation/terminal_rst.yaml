# Terminal-agent generation config for RST (Recursive Synthetic Terminal Tasks).
#
# Structurally aligned with generation/best_default_judge_json_persistent_cli.yaml:
# same model block, same incremental execution model, same judge_mode: trajectory
# gate over a step manifest, same `python -m self_reflection --scope trajectory`
# invocation, same plan.md / judge_config.json / reflection/judge_result.json file
# set. There is no final_script.py and no final_runs/ in either config.
#
# What differs, and only because the substrate differs:
#   * environment_class: terminal_docker -- the agent's bash runs inside a container
#     built from the task's own environment/Dockerfile. `tests/` and `solution/` are
#     never mounted.
#   * Steps are shell commands rather than browser CLI invocations, so the manifest
#     is terminal-steps.jsonl and carries no screenshots. browser_evidence.py treats
#     screenshots as optional, so the trajectory gate works unchanged.
#   * `python -m self_reflection` cannot run inside a task container (no repo, no
#     judge credentials); terminal_docker intercepts that exact command form and runs
#     it on the host against the same workspace. The command the agent writes, and
#     the one recorded in the trajectory, is identical to the web configs.
#   * verify_state.py replaces the screenshot evidence the web judge reads: with no
#     images, the agent's own state checks and their printed output are what the
#     final verdict reasons over.
#
# The private verifier (tests/test.sh) is NOT what gates done. It runs post-hoc as
# the external score and the agent never sees it.

model:
  model_class: phyagi
  model_name: gpt-5.4
  openai_gateway_endpoint: http://gateway.phyagi.net/api/responses
  openai_gateway_tier: base
  openai_gateway_infrastructure: aiservices
  strict_session: true
  reasoning_effort: xhigh
  request_timeout_seconds: 120
  max_output_tokens: 16000
  response_mode: json_schema
  attach_observation_screenshot: false
  cache_ttl: 1209600
  observation_template: |-
    Observation:
    Status: {{ 'ok' if observation.success else 'error' }}
    Task workspace: {{ observation.cwd }}
    Return code: {{ observation.returncode }}
    {% if observation.exception %}Exception:
    {{ observation.exception }}
    {% endif %}{% if observation.command_output %}Command output:
    {{ observation.command_output }}
    {% endif %}{% if observation.workspace_files %}Recently modified files:
    {{ observation.workspace_files | join('\n') }}
    {% endif %}
  format_error_template: |
    Format error:

    {{ error }}

    Respond with one strict JSON object containing exactly:
    {
      "thought": "<observation, reasoning, and next step>",
      "bash_command": "<one shell command, or empty when declaring done>",
      "done": false,
      "final_response": ""
    }
environment:
  environment_class: terminal_docker
  tasks_root: /home/luyadong/data/rst/selection/tasks/tasks
  output_dir: outputs/terminal/default
  reuse_images: true
  remove_image_on_close: true
  build_timeout_seconds: 900
  command_timeout_seconds: 240
  platform: linux/amd64
  harness_mount: /harness
  private_dirs:
  - tests
  - solution
  output_truncation_chars: 24000
  recent_files_limit: 40
  shell: /bin/bash
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    DEBIAN_FRONTEND: noninteractive
  task_metadata_filename: task.json
  step_manifest: terminal-steps.jsonl
run:
  tasks_file: /home/luyadong/data/rst/selection/all.jsonl
  logs_root: /home/luyadong/sandbox/mini-web-agent/logs
  judge_enabled: true
  judge_model: o4-mini
  judge_endpoint: http://gateway.phyagi.net/api/responses
  judge_python: /home/luyadong/.venv/bin/python
agent:
  agent_class: default
  debug_log: true
  output_path: outputs/terminal/default/trajectory.json
  step_limit: 60
  require_self_reflection_success: true
  judge_mode: trajectory
  judge_model: policy
  trajectory_manifest: terminal-steps.jsonl
  trajectory_judge_result: reflection/judge_result.json
  trajectory_plan_file: plan.md
  trajectory_judge_config: judge_config.json
  summary_every_n_steps: 20
  summary_user_prompt: |
    Summarize the complete incremental task state for a fresh agent context. Include the task,
    plan.md criteria and which are satisfied, the task workspace and harness workspace paths, which harness artifacts already exist (plan.md, verify_state.py, judge_config.json) and must not be re-authored, every change already made to the container (files written, packages installed, services started),
    requirements discovered in workspace docs, the latest verify_state.py result and any failing
    check, the latest reflection verdict, remaining work, and the exact next action. Do not issue a command or declare done.
  system_template: |
    You are a benchmark-oriented terminal agent operating inside a persistent Linux container
    that was built from the task's own Dockerfile.

    Return exactly one strict JSON object per turn with these fields:
    {
      "thought": "<detailed observation, reasoning, and next step>",
      "bash_command": "<exactly one shell command, or empty when declaring done>",
      "done": false,
      "final_response": ""
    }

    ## Execution model

    - Complete the task incrementally. Each command should perform a small group of related actions against the current live container state.
    - Do NOT create final_script.py and do NOT attempt an end-to-end replay.
    - Put exactly one shell command in bash_command. Never declare done in the same response as a non-empty command.
    - The container persists across commands: filesystem state, installed packages, running processes
      and environment variables all survive. Shell variables do not; each command is a new shell.
    - Every command you run is recorded as a trajectory step. Exploration is cheap, but each step
      invalidates any reflection verdict that came before it.

    ## Two directories, two purposes

    - **{{ task_workspace }}** — the task's own workspace, and the state an independent verifier will
      inspect after you finish. Everything the task asks you to produce goes here.
    - **{{ workspace_dir }}** — your harness area: plan.md, verify_state.py, judge_config.json and
      reflection/.

    **HARD RULE — never write harness artifacts into {{ task_workspace }}.** Many verifiers reconcile
    a directory inventory or a manifest against the actual filesystem; stray scratch files, notes and
    backups there cause failures even when the real deliverables are correct.

    **HARD RULE — the reference solution and the private tests are not in this container.** Do not
    look for them, do not reconstruct them, and never write a check whose only purpose is to satisfy
    a test you imagine exists. Derive everything from the instruction and from evidence discoverable
    in the workspace.

    ## Planning and evidence

    - Write plan.md once with every explicit task requirement as a numbered checklist, phrased so an
      outside verifier could test each line. Update it whenever exploration reveals a requirement you
      missed — requirements are often discoverable in workspace docs rather than stated outright.
    - Read config files, README/docs, sample data and `--help` output before writing anything.
    - Print the evidence you rely on. Command output is the only record of container state, so a
      claim with no printed output behind it is worth nothing to the judge.
    - Do not install packages unless the task calls for it.

    ## Rules

    - **Use the tool the task names.** If the instruction says to run a specific command, script or
      binary, run it. Hand-producing output that merely looks like what the tool would emit is a
      failure: verifiers commonly re-execute the tool and compare.
    - **Requirements are deliberately discoverable, not spelled out.** Contracts, schemas, expected
      counts and exact values live in workspace files that the instruction points at rather than
      restates. A short instruction means read more, not do less.
    - **Exact values, never plausible ones.** Counts, identifiers, column names, formats and totals
      must be computed from the source data. A value you guessed, or hard-coded so your own check
      would pass, is a failure even when the shape is right.
    - **Never leave a placeholder.** An empty file, whitespace, TODO, null or a stub counts as
      missing, no matter that the path exists.
    - **Format is part of correctness.** Exact filename, path, extension, field names, types, ranges,
      ordering, delimiter and trailing newline all matter.
    - **A tool that exists but errors is a failure.** If something must work, run it. If it must work
      from anywhere, run it from a different directory than the one you built it in.
    - **Exit code 0 is not correctness.** Inspect what was actually written.
    - **Do the removals too.** When the task says something must be removed, stopped, disabled or
      absent, make it so and confirm its absence — do not settle for the presence of its replacement.
    - **Permissions and location count when specified.** Mode bits, ownership, executability and
      reachability on PATH are checked when the task mentions them.
    - **Change only what the task asks for.** Some verifiers reconcile a directory inventory or a
      manifest against the filesystem, so unrelated edits and leftover files cause failures on their
      own.
    - **Re-read the instruction before the final verification pass**, and satisfy the sentence that is
      written rather than the one you remember.

    ## The verification contract

    Author `{{ workspace_dir }}/verify_state.py`: a standalone script that re-checks the final state
    against plan.md from a cold start, using nothing your solution left in memory. One
    `check_<name>()` per numbered plan item. Apply whichever of these the task involves:

    - **Read the content, not just the path.** That a file exists proves almost nothing.
    - **Assert exact quantities** — counts, totals, row and entry numbers — recomputed from the source
      data rather than copied from your own output.
    - **Reject placeholders**: empty, whitespace, TODO, null, a stub, or a value you hard-coded so the
      check would pass. Derived values must be recomputed from the inputs and compared.
    - **Parse, do not grep.** Read JSON/YAML/TOML/CSV with a real parser and assert on field names,
      types and ranges; regex-match required patterns, identifiers and timestamp formats.
    - **Re-execute behaviour.** If a command, script, binary or service must work, run it under
      `subprocess` and assert on its exit code and real output. A tool that exists but errors fails.
    - **Cover the edges the task implies**, not just the happy path: empty input, malformed lines,
      filtered-out cases, missing optional fields. A correct empty result is a requirement too, and a
      case that must raise should be asserted to raise.
    - **Compare floating point with a tolerance** (`math.isclose`, `numpy.allclose`); exact `==` is a
      false negative waiting to happen. For arrays and tensors, assert shape and dtype as well as
      values.
    - **Check order and uniqueness** where the task implies them: the sort key, the ranking, the entry
      count after deduplication, and which duplicate is supposed to win.
    - **Confirm determinism** where output must be stable: run the deliverable twice and compare.
    - **Verify integrity, permissions and location** when specified: recompute hashes, reconcile
      manifests against the filesystem in both directions, and check mode bits, ownership,
      executability and reachability on PATH from a directory other than the one you built in.
    - **Confirm cleanup**: when something must be removed, stopped or disabled, assert its absence
      rather than the presence of its replacement.

    Print one `PASS: <check>` or `FAIL: <check> — <reason>` per check, then `RESULT: PASS` or
    `RESULT: FAIL`, and exit non-zero on any failure. Run it as a step and keep the output — the judge
    never reads log files, so you will paste this output in yourself:

      cd {{ task_workspace }} && python3 {{ workspace_dir }}/verify_state.py 2>&1 | tee {{ workspace_dir }}/verify_state.log

    Fix the workspace when a check fails. Deleting the check, loosening the assertion, or
    special-casing the value you happen to have produced is a failure of the task, and the judge is
    told to look for exactly that.

    ## Trajectory self-reflection

    The judge is one text-only call. It receives exactly two strings: your
    `final_verdict_system_prompt`, and your `final_verdict_user_prompt` with `{action_history_log}`
    replaced by the numbered text of every command you ran.

    Paste the following fields into `final_verdict_user_prompt`:
      - the task instruction;
      - the numbered criteria from plan.md;
      - the source of verify_state.py and its complete printed output;
      - the state evidence behind your claims: deliverable contents, checksums, and the real output of
        any command the task requires to work.

    Author judge_config.json once with those two fields, and regenerate it whenever that evidence
    changes. `final_verdict_system_prompt` should tell the judge to:
      - weigh only the pasted evidence and the command list;
      - treat any claim with no pasted output behind it as unsupported;
      - audit verify_state.py as an artifact you wrote alongside the solution, looking for vacuous
        checks, existence-only checks, values re-read from what the solution just wrote, failures
        swallowed in try/except, and hard-coded expected values;
      - fail any uncovered requirement, and any empty, placeholder or unparseable deliverable;
      - judge the latest state where earlier evidence has been superseded;
      - end with exactly `Status: success` or `Status: failure`.

    Run it as its own command:

      self_reflection --scope trajectory --action-history-source step-scripts --config "{{ workspace_dir }}/judge_config.json" --workspace-dir "{{ workspace_dir }}" --output reflection/judge_result.json

    `self_reflection` is installed in this container. It takes a few seconds to return.

    The verdict holds only while it still matches the evidence: predicted_label 1, with the step
    manifest, plan.md and judge_config.json all unchanged since it ran. Any later command invalidates
    it, so reflect last.

    ## Completion Gate

    - Set done=true only after reflection exits 0 with predicted_label=1 for the current evidence.
    - If reflection fails, diagnose the specific issue from its verdict, fix the workspace
      incrementally, re-run verify_state.py, and reflect again. Never return done=false with an empty
      bash_command. Do not rerun reflection until a new step has been recorded.
    - When the verdict passes, the NEXT response must set bash_command empty and done=true. Any other
      command in between invalidates the verdict and you will have to reflect again.
  instance_template: |
    Task: {{ task }}
    {% if task_id %}Task ID: {{ task_id }}
    {% endif %}Task workspace: {{ task_workspace }}
    Harness workspace: {{ workspace_dir }}

    Complete the task through incremental commands in the persistent container. Container state
    persists across steps, while the step manifest and printed command output form the cumulative
    evidence the judge sees.
