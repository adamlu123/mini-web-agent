### Full SFT: Qwen3.5-9B on om2w_4000 run1 sequential-compact-tools data
### (1524 trajs -> 7774 samples: 5222 trajectory_session + 552 image_qa
###  + 1000 self_reflection_image + 1000 self_reflection_final).
### Intended launch: 4 nodes x 8 B200, per-device batch 1 => global batch 32
### (~243 steps/epoch, ~486 total at 2 epochs).
###
### Data prep (see .claude/skills/web-agent-seq-sft-submit):
###   raw json: LlamaFactory/data/web_agent_seq_om2w4000_run1.json (git LFS)
###   images:   /data/t-yifeili/om2w_4000_sampling/outputs/om2w_4000_run1/... (dev box)
###   package into the portable bundle below with package_web_agent_images.py
###   (the bundle's dataset_info.json is auto-generated; no manual registration).
###
### Think alignment (docs/qwen3_5_think_alignment.md): with template qwen3_5 +
### mask_history false + enable_thinking true, history <think> stays in prompts
### and the 2552 no-think judge turns get an empty "<think>\n\n</think>\n\n"
### injected into the target (expected). Serve the resulting ckpt with
### configs/qwen3_5_train_aligned.jinja or multi-turn inference is misaligned.

### model
model_name_or_path: Qwen/Qwen3.5-9B
image_max_pixels: 262144
trust_remote_code: true
enable_liger_kernel: false

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
use_reentrant_gc: false

### dataset
dataset_dir: data/web_agent_seq_om2w4000_run1_portable_bundle
media_dir: data/web_agent_seq_om2w4000_run1_portable_bundle
dataset: web_agent_seq_om2w4000_run1_portable
template: qwen3_5
cutoff_len: 40000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
mask_history: false
enable_thinking: true

### output
output_dir: saves/qwen35_9b/full/web_agent_seq_om2w4000_run1_40k_4node
logging_steps: 10
save_strategy: steps
save_steps: 200
save_total_limit: 2
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: qwen35_9b_web_agent_seq_om2w4000_run1_40k_4node

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
