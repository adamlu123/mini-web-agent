### Full SFT overfit probe: one WebJudge-success OM2W task from the 20260630 run for 100 epochs.
### Base model is the current web_agent_seq_label1_allwebchain_sr1k_40k_4node_pvcdata checkpoint.

### model
model_name_or_path: /data/t-yifeili/ckpts/web_agent_seq_label1_allwebchain_sr1k_40k_4node_pvcdata
image_max_pixels: 262144
trust_remote_code: true
enable_liger_kernel: false

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
use_reentrant_gc: false

### dataset
dataset_dir: data/web_agent_seq_label1_ade4_overfit_100ep_20260630_bundle
media_dir: data/web_agent_seq_label1_ade4_overfit_100ep_20260630_bundle
dataset: web_agent_seq_label1_ade4_overfit_100ep_20260630
template: qwen3_5
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 1
mask_history: false
enable_thinking: true

### output
output_dir: saves/qwen35_9b/full/web_agent_seq_label1_ade4_overfit_100ep_20260630
logging_steps: 1
save_strategy: steps
save_steps: 100000
save_total_limit: 1
save_only_model: true
plot_loss: false
overwrite_output_dir: true
report_to: none
run_name: qwen35_9b_web_agent_seq_label1_ade4_overfit_100ep_20260630

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
