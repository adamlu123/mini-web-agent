### Full SFT overfit probe: multi-turn inline-compact examples from done=true m2w_exp_0280 for 100 epochs.

### model
model_name_or_path: Qwen/Qwen3.5-9B
image_max_pixels: 262144
trust_remote_code: true
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
use_reentrant_gc: false

### dataset
dataset_dir: data/web_agent_state_debug_inline_compact_done_m2w_exp_0280_multi_bundle
media_dir: data/web_agent_state_debug_inline_compact_done_m2w_exp_0280_multi_bundle
dataset: web_agent_state_debug_inline_compact_done_m2w_exp_0280_multi
template: qwen3_5
cutoff_len: 40000
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 1
mask_history: false
enable_thinking: true

### output
output_dir: saves/qwen35_9b/full/web_agent_inline_compact_done_m2w_exp_0280_multi_9b_base_100ep
logging_steps: 1
save_strategy: steps
save_steps: 100000
save_total_limit: 1
save_only_model: true
plot_loss: false
overwrite_output_dir: true
report_to: none
run_name: qwen35_9b_web_agent_inline_compact_done_m2w_exp_0280_multi_9b_base_100ep

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 100.0
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null