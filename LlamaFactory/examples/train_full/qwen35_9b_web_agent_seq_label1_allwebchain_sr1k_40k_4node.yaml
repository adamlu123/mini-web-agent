### Full SFT: Qwen3.5-9B on label=1 trajectory sessions + image_qa + self_reflection, all webchain outputs.
### Intended launch: 4 nodes x 8 B200, per-device batch size 1 => global batch 32.

### model
model_name_or_path: Qwen/Qwen3.5-9B
image_max_pixels: 262144
trust_remote_code: true
enable_liger_kernel: false

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
use_reentrant_gc: false

### dataset
dataset_dir: data/web_agent_seq_sessions_tools_label1_allwebchain_sr1k_0629_portable_bundle
media_dir: data/web_agent_seq_sessions_tools_label1_allwebchain_sr1k_0629_portable_bundle
dataset: web_agent_seq_sessions_tools_label1_allwebchain_sr1k_0629_portable
template: qwen3_5
cutoff_len: 40000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
mask_history: false
enable_thinking: true

### output
output_dir: saves/qwen35_9b/full/web_agent_seq_label1_allwebchain_sr1k_40k_4node
logging_steps: 10
save_strategy: steps
save_steps: 200
save_total_limit: 2
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: qwen35_9b_web_agent_seq_label1_allwebchain_sr1k_40k_4node

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
