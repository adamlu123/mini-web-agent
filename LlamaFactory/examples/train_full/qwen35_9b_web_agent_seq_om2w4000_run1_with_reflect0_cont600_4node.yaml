### CONTINUATION run (4-node): warm-restart from checkpoint-600 of the p1 run
### saves/qwen35_9b/full/qwen35_9b_web_agent_seq_om2w4000_run1_with_reflect0_40k_4node_p1_20260708_2235
### (4 nodes x 8 = global batch 32 -> ~274 steps/epoch, 3 epochs ~= 823 steps;
###  checkpoint-600 ~= epoch 2.19).
###
### Why not resume_from_checkpoint: save_only_model: true -> the ckpt has NO
### optimizer/deepspeed state, a true resume is impossible. We load the ckpt as
### model_name_or_path (weights-only warm restart) and train the remaining budget.
###
### PREREQUISITES (run in a PVC-mounted pod BEFORE submitting):
###   1. backup the ckpt out of the volatile saves/ dir:
###        mkdir -p /mnt/pvc/luyadong/models
###        cp -a "/mnt/pvc/luyadong/code/mini-web-agent/LlamaFactory/saves/qwen35_9b/full/qwen35_9b_web_agent_seq_om2w4000_run1_with_reflect0_40k_4node_p1_20260708_2235/checkpoint-600" \
###              /mnt/pvc/luyadong/models/web_agent_seq_om2w4000_run1_with_reflect0_p1_ckpt600_bak
###   2. merge the vision tower back (text-SFT ckpts drop it; without this the
###      visual weights get RANDOM-initialized on load):
###        BASE=$(ls -d /mnt/pvc/luyadong/hf_cache/hub/models--Qwen--Qwen3.5-9B/snapshots/*/ | head -1)
###        python /mnt/pvc/luyadong/code/mini-web-agent/scripts/merge_vision_from_base.py \
###          --ckpt /mnt/pvc/luyadong/models/web_agent_seq_om2w4000_run1_with_reflect0_p1_ckpt600_bak --base "$BASE"
###
### Budget: original 3 epochs + 1 extra = 4 total. ckpt is at epoch ~2.19, so
### remaining = 4.0 - 2.19 ~= 1.8 epochs (~495 steps at global batch 32).
### LR: original cosine (1e-5, warmup 5%) was at ~1.9e-6 by step 600; continue
### from there with a fresh cosine decay to 0 over the remaining budget.
### MUST submit with NODES=4 (global batch 32, matching the step math above).

### model
model_name_or_path: /mnt/pvc/luyadong/models/web_agent_seq_om2w4000_run1_with_reflect0_p1_ckpt600_bak
image_max_pixels: 262144
trust_remote_code: true
enable_liger_kernel: false

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
use_reentrant_gc: false

### dataset
dataset_dir: /mnt/pvc/experiments/t-yifeili/data/web_agent_seq_om2w4000_run1_with_reflect0_portable_bundle
media_dir: /mnt/pvc/experiments/t-yifeili/data/web_agent_seq_om2w4000_run1_with_reflect0_portable_bundle
dataset: web_agent_seq_om2w4000_run1_with_reflect0_portable
template: qwen3_5
cutoff_len: 40000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
mask_history: false
enable_thinking: true

### output
output_dir: saves/qwen35_9b/full/web_agent_seq_om2w4000_run1_with_reflect0_40k_4node_cont600
logging_steps: 10
save_strategy: steps
save_steps: 200
save_total_limit: 20
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: qwen35_9b_web_agent_seq_om2w4000_run1_with_reflect0_40k_4node_cont600

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.9e-6
num_train_epochs: 1.8
lr_scheduler_type: cosine
warmup_ratio: 0.01
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
